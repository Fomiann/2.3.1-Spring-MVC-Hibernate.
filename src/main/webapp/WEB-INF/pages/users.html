<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Пользователи</title>
    <style>
        table { border-collapse: collapse; width: 80%; margin: 20px auto; }
        th, td { border: 1px solid black; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
        .form-add { text-align: center; margin: 20px; }
    </style>
</head>
<body>
<h1 style="text-align:center;">Список пользователей</h1>

<div class="form-add">
    <form action="/add" method="post">
        <input type="text" name="name" placeholder="Имя" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="number" name="age" placeholder="Возраст" required>
        <button type="submit">Добавить</button>
    </form>
</div>

<table>
    <tr>
        <th>ID</th>
        <th>Имя</th>
        <th>Email</th>
        <th>Возраст</th>
        <th>Действия</th>
    </tr>
    <tr th:each="user : ${users}">
        <td th:text="${user.id}">1</td>
        <td th:text="${user.name}">John</td>
        <td th:text="${user.email}">john@mail.com</td>
        <td th:text="${user.age}">25</td>
        <td>
            <a th:href="@{/update(id=${user.id})}">Редактировать</a>
            <form action="/delete" method="post" style="display:inline;">
                <input type="hidden" name="id" th:value="${user.id}">
                <button type="submit">Удалить</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
